# 主测试：测试集前 20 图 × 3 掩码 × 30% 面积 × 3 档 = 180 次（PRD §7.6）
# 运行命令见 scripts/run_experiment.py 顶部的 `--split test --image-limit 20 --target-area 0.30`。
experiment_id: main_test
method: lanpaint
policy: M1
budget:
  low: 2
  middle: 5
  high: 8
outer_steps: 20
batch_size: 1
image_size: 256
seed: 42
precision: fp32
data_manifest: data/manifest.csv
checkpoint: checkpoints/256x256_diffusion_uncond.pt
checkpoint_sha256: A37C32FFFD316CD494CF3F35B339936DEBDC1576DAD13FE57C42399A5DBC78B1
output_dir: results/raw
cache_dir: data/_cache/results
enable_dynamic_stopping: false
